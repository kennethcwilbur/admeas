<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" width="300" height="250">
  <!-- Fictional mortgage-lender display ad (IAB medium rectangle proportions). No real brand. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="299" height="249" fill="url(#bg)" stroke="#dadce0"/>
  <!-- "Ad" marker chip, top right -->
  <rect x="266" y="8" width="26" height="17" rx="2" fill="#ffffff" stroke="#b8bcc2"/>
  <text x="279" y="20.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5f6368">Ad</text>
  <!-- house icon -->
  <g>
    <polygon points="150,34 108,68 120,68 120,100 180,100 180,68 192,68" fill="#1f3a5f"/>
    <rect x="138" y="76" width="14" height="24" fill="#eef4fb"/>
    <rect x="160" y="78" width="12" height="12" fill="#eef4fb"/>
    <!-- percent badge -->
    <circle cx="192" cy="44" r="16" fill="#f2a33c"/>
    <text x="192" y="50" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">%</text>
  </g>
  <!-- headline: Ken's copy, split across two lines -->
  <text x="150" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1a2f4b">Amazing rates for</text>
  <text x="150" y="162" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1a2f4b">amazing borrowers</text>
  <!-- CTA button -->
  <rect x="62" y="184" width="176" height="42" rx="21" fill="#e8710a"/>
  <text x="150" y="211" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#ffffff">Click here now</text>
</svg>
